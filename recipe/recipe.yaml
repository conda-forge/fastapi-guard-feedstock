schema_version: 1

context:
  version: "8.1.0"

package:
  name: fastapi-guard
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-guard/fastapi_guard-${{ version }}.tar.gz
  sha256: ec6daefed92d1b692de50552d8e972811c74ab7fd84e6c755dd9063949f80dae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - fastapi >=0.109.0
    - guard-core >=4.1.0
    - starlette >=0.35.0
    - uvicorn

tests:
  - python:
      imports:
        - guard
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A security library for FastAPI to control IPs, log requests, and detect penetration attempts.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/rennf93/fastapi-guard

extra:
  recipe-maintainers:
    - thewchan
