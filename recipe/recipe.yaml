schema_version: 1

context:
  version: "7.8.0"

package:
  name: fastapi-guard
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-guard/fastapi_guard-${{ version }}.tar.gz
  sha256: 8340a2b9bac4277f8ecb521e3f71a26c164e819b8ef474cd04d6d50d909826ea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - fastapi
    - guard-core >=3.14.0
    - starlette
    - uvicorn

tests:
  - python:
      imports:
        - guard
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A security library for FastAPI to control IPs, log requests, and detect penetration attempts.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/rennf93/fastapi-guard

extra:
  recipe-maintainers:
    - thewchan
